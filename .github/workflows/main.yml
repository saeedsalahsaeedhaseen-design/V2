name: Build Barq P2P APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب الملفات
        uses: actions/checkout@v4

      - name: فك ضغط المشروع وإصلاح الإعدادات
        run: |
          # فك ضغط الملف المضغوط
          unzip -q -o "*.zip"
          
          # إذا تم فك الضغط داخل مجلد فرعي، ننتقل إليه تلقائياً
          EXTRACTED_DIR=$(ls -d */ | grep -vE '^\.github/' | head -n 1)
          if [ -d "$EXTRACTED_DIR" ]; then
            cd "$EXTRACTED_DIR"
          fi
          
          # إصلاح الإعدادات وتعديل الملفات داخل المشروع
          if [ -f ".env.example" ]; then cp .env.example .env; else touch .env; fi
          if [ -f "app/build.gradle.kts" ]; then
            sed -i '/signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts
          fi
          if [ -f "gradle.properties" ]; then
            sed -i '/kotlin.compiler.execution.strategy/d' gradle.properties
            sed -i '/org.gradle.configuration-cache/d' gradle.properties
          fi
          
          # حفظ مسار المشروع للخطوات القادمة
          echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV

      - name: إعداد Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: تثبيت محرك Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: بناء ملف الـ APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          gradle assembleDebug --no-daemon --no-configuration-cache

      - name: رفع ملف الـ APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: Barq-P2P-5GHz-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
